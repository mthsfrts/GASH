name: E2E Tests

on:
  push:
    branches: [ prod, main ]
    paths:
      - 'Test/E2E/**'
      - 'Analysis/**'
      - 'GASH.py'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [ prod, main ]
    paths:
      - 'Test/E2E/**'
      - 'Analysis/**'
      - 'GASH.py'
      - '.github/workflows/e2e-tests.yml'
  workflow_dispatch:

jobs:
  e2e-tests-mock:
    name: E2E Tests (Mock Token)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Run E2E tests without real token
        run: |
          pytest Test/E2E/ -v -m "not requires_real_token" --tb=short --maxfail=5
        continue-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-mock-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            Test/E2E/*.log
            .pytest_cache/
          retention-days: 7

  e2e-tests-real-token:
    name: E2E Tests (Real Token)
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Run E2E tests with real token
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pytest Test/E2E/ -v -m "requires_real_token" --tb=short --maxfail=10
        continue-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-real-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            Test/E2E/*.log
            .pytest_cache/
          retention-days: 7

  e2e-tests-all:
    name: E2E Tests (Complete Suite)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout psutil

      - name: Run complete E2E test suite
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pytest Test/E2E/ -v --tb=short --maxfail=15
        continue-on-error: false

      - name: Generate test summary
        if: always()
        run: |
          echo "## E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: Ubuntu" >> $GITHUB_STEP_SUMMARY
          echo "- **Python**: 3.11" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Mode**: Complete Suite" >> $GITHUB_STEP_SUMMARY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-complete
          path: |
            Test/E2E/*.log
            .pytest_cache/
          retention-days: 30

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [e2e-tests-mock]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## E2E Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Jobs" >> $GITHUB_STEP_SUMMARY
          echo "- Mock Token Tests: ${{ needs.e2e-tests-mock.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Scenario 1: Clean Repository" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Scenario 2: Multi-Smell Detection" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Scenario 3: Real Repository Analysis" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Scenario 4: Execution Modes" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Scenario 5: Report Generation" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Scenario 6: Performance" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Scenario 7: Error Handling" >> $GITHUB_STEP_SUMMARY
