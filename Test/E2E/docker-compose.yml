version: '3.8'

services:
  gash-e2e-test:
    build:
      context: ../..
      dockerfile: Test/E2E/Dockerfile
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-mock_token_for_testing}
      - GASH_TEST_MODE=e2e
      - PYTHONPATH=/app
    volumes:
      # Mount source code as read-only
      - ../../:/app:ro
      # Mount fixtures
      - ./fixtures:/app/Test/E2E/fixtures:ro
      # Mount test results (writable)
      - test-results:/app/test-results
    working_dir: /app
    command: >
      pytest Test/E2E/ -v
      --tb=short
      --timeout=300
      -m "not requires_real_token"
      --junitxml=/app/test-results/e2e-results.xml

  # Service for running tests with real token (CI)
  gash-e2e-test-ci:
    build:
      context: ../..
      dockerfile: Test/E2E/Dockerfile
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GASH_TEST_MODE=e2e
      - PYTHONPATH=/app
    volumes:
      - ../../:/app:ro
      - ./fixtures:/app/Test/E2E/fixtures:ro
      - test-results:/app/test-results
    working_dir: /app
    command: >
      pytest Test/E2E/ -v
      --tb=short
      --timeout=300
      --junitxml=/app/test-results/e2e-ci-results.xml
    profiles:
      - ci

volumes:
  test-results:
    driver: local
