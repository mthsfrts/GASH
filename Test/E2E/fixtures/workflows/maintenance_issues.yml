# Maintenance Issues Workflow - Maintenance smells expected
# This workflow intentionally contains maintenance problems for testing
# Used in Scenario 2 to validate maintenance smell detection

name: Maintenance Issues Workflow

on: push

# Misconfiguration smell: concurrency without group
concurrency:
  cancel-in-progress: false

jobs:
  # CodeReplica smell: duplicated setup steps across jobs
  build:
    runs-on: ubuntu-latest
    # ErrorHandling smell: continue-on-error at job level
    continue-on-error: true
    # ErrorHandling smell: very short timeout
    timeout-minutes: 1
    # ErrorHandling smell: fail-fast disabled
    strategy:
      fail-fast: false
      matrix:
        node-version: [14, 16, 18]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        # ErrorHandling smell: continue-on-error at step level
        continue-on-error: true
        timeout-minutes: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

  # CodeReplica smell: same setup as build job
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node-version: [14, 16, 18]

    steps:
      # Duplicated steps from build job
      - name: Checkout code
        uses: actions/checkout@v4
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

  # CodeReplica smell: more duplication
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      # Same checkout and setup pattern
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

  # Misconfiguration smell: missing runs-on
  deploy:
    needs: [build, test]
    # Missing: runs-on
    steps:
      - name: Deploy
        run: echo "Deploying..."
        # Misconfiguration smell: complex conditional
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && (success() || failure()) && contains(github.event.head_commit.message, 'deploy')

  # Misconfiguration smell: job with fuzzy version
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Misconfiguration smell: fuzzy version in uses
        uses: actions/checkout@v4.*

      - name: Setup
        # Misconfiguration smell: another fuzzy version
        uses: actions/setup-node@v2.x
