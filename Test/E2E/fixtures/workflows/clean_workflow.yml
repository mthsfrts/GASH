# Clean Workflow - No smells expected
# This workflow follows GitHub Actions best practices
# Used in Scenario 1 to validate no false positives

name: Clean CI Workflow

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Minimal permissions (principle of least privilege)
permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        timeout-minutes: 3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 5
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Run linter
        run: npm run lint
        timeout-minutes: 3

      - name: Run tests
        run: npm test
        timeout-minutes: 10
        env:
          CI: true

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Deploy application
        run: |
          echo "Deploying to staging..."
          echo "Deployment complete"
        timeout-minutes: 5
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
